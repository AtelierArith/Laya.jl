name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The test environment uses [sources] (Julia >= 1.11).
        version: ['1.11', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Code-quality checks and the Python-free end-to-end tests on a tiny random checkpoint.
      # The comparisons against the Python reference need extern/laya-mlx, MLX and the real
      # checkpoints (see SETUP.md) and run locally.
      LAYA_TEST_GROUPS: aqua,smoke
      HF_HUB_OFFLINE: '1'
      # The test environment includes PythonCall (for the reference groups, not run here);
      # point it at the runner's Python so CondaPkg does not install one while precompiling.
      JULIA_CONDAPKG_BACKEND: 'Null'
      JULIA_PYTHONCALL_EXE: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
